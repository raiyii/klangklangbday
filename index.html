<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 20th Birthday, Klang Klang!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff1f7;--bg2:#ffcfe2;--pink:#f2679f;--rose:#ffa6c9;--lav:#ffb8d4;--sun:#ffe3ee;--mint:#ffd1e3;--ink:#a8346d;--card:rgba(255,255,255,.6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,var(--bg1),var(--bg2));color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
#float{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.h{position:absolute;bottom:-60px;font-size:var(--s);animation:up var(--d) linear infinite;animation-delay:var(--dl);opacity:.8}
@keyframes up{from{transform:translate(0,0) rotate(-10deg)}50%{transform:translate(20px,-60vh) rotate(10deg)}to{transform:translate(-10px,-125vh) rotate(-8deg)}}
.sp{position:absolute;font-size:var(--s);animation:tw 2s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes tw{50%{transform:scale(1.5) rotate(25deg);opacity:.3}}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;padding:12px}
.hb{margin:0;font-weight:700;font-size:clamp(1.6rem,6vw,3rem);color:var(--pink);-webkit-text-stroke:0;text-shadow:3px 3px 0 #fff}
.hb span{display:inline-block;animation:pop .8s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*60ms + 300ms)}
@keyframes pop{from{transform:translateY(50px) scale(.2) rotate(-20deg);opacity:0}}
.nm{margin:0;font-family:'Pacifico','Brush Script MT',cursive;font-weight:400;font-size:clamp(3rem,15vw,7.5rem);line-height:1.1;color:var(--pink);text-shadow:4px 4px 0 #fff,8px 8px 0 var(--lav);animation:sw 3s ease-in-out infinite,pop 1s 1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes sw{50%{transform:rotate(-3deg) scale(1.04)}}
.age{display:inline-flex;align-items:center;gap:10px;background:var(--pink);color:#fff;font-weight:700;font-size:clamp(1.2rem,5vw,2rem);padding:6px 24px;border-radius:99px;box-shadow:0 5px 0 var(--lav);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.row{display:flex;align-items:flex-end;justify-content:center;gap:2vw;width:100%}
#cake{width:min(46vw,260px);cursor:pointer;overflow:visible}
#bq{width:min(38vw,210px);transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(4deg)}}
.fl{transform-origin:50% 100%;animation:fl .35s ease-in-out infinite alternate}
.fl:nth-of-type(2n){animation-duration:.45s}
@keyframes fl{from{transform:scale(1,1) rotate(-5deg)}to{transform:scale(.85,1.2) rotate(5deg)}}
.out .fl{display:none}
#hint{font-size:.95rem;opacity:.8;margin:0}
#start{position:fixed;inset:0;z-index:20;background:linear-gradient(var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
#start .big{font-size:4.5rem;animation:bob 1.4s ease-in-out infinite}
#start h2{margin:0;font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(1.8rem,7vw,3rem);color:var(--pink)}
button{font:inherit;font-weight:700;font-size:1.3rem;border:0;border-radius:99px;padding:14px 34px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 6px 0 var(--lav);transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lav)}
button:focus-visible,svg:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#mute{position:fixed;z-index:10;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);font-size:1.3rem;padding:8px 14px;background:var(--card);box-shadow:none}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.h,.sp,.nm,.age,#bq,.fl,#start .big{animation:none}.hb span{animation-duration:.01s}}
</style></head><body>
<div id="float" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="mute" class="hide" aria-label="Mute music">🔊</button>
<main>
<p class="hb" id="hb" aria-label="Happy Birthday"></p>
<h1 class="nm">Klang Klang</h1>
<div class="age">🎀 turning 20! 🎀</div>
<div class="row">
<svg id="cake" viewBox="0 0 300 270" role="button" aria-label="Blow out the candles" tabindex="0">
<ellipse cx="150" cy="248" rx="145" ry="16" fill="#fff" stroke="#c2457f" stroke-width="3"/>
<rect x="30" y="170" width="240" height="78" rx="18" fill="#ff8fb8" stroke="#c2457f" stroke-width="4"/>
<rect x="60" y="112" width="180" height="64" rx="16" fill="#fff3d6" stroke="#c2457f" stroke-width="4"/>
<path d="M60 130q15 22 30 0t30 0 30 0 30 0 30 0v-8H60z" fill="#fff" stroke="#c2457f" stroke-width="3" stroke-linejoin="round"/>
<path d="M30 190q20 24 40 0t40 0 40 0 40 0 40 0v-10H30z" fill="#fff" stroke="#c2457f" stroke-width="3" stroke-linejoin="round"/>
<g fill="#ffd23f" stroke="#c2457f" stroke-width="2"><circle cx="70" cy="224" r="7"/><circle cx="130" cy="230" r="7"/><circle cx="190" cy="224" r="7"/><circle cx="240" cy="230" r="7"/></g>
<text x="75" y="125" font-family="Fredoka,sans-serif" font-weight="700" font-size="84" fill="#7be8d0" stroke="#c2457f" stroke-width="5" paint-order="stroke">2</text>
<text x="152" y="125" font-family="Fredoka,sans-serif" font-weight="700" font-size="84" fill="#ffd23f" stroke="#c2457f" stroke-width="5" paint-order="stroke">0</text>
<g fill="#ffb347" stroke="#e8590c" stroke-width="2"><path class="fl" d="M105 52c-10-11-7-22 0-31 7 9 10 20 0 31z"/><path class="fl" d="M193 52c-10-11-7-22 0-31 7 9 10 20 0 31z"/></g>
</svg>
<svg id="bq" viewBox="0 0 200 260" aria-label="Bouquet of sunflowers and lilies" role="img">
<defs><symbol id="s" viewBox="-20 -20 40 40"><g fill="#ffb703"><ellipse cy="-13" rx="4" ry="8" transform="rotate(0)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(30)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(60)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(90)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(120)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(150)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(180)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(210)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(240)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(270)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(300)"/><ellipse cy="-13" rx="4" ry="8" transform="rotate(330)"/></g><g fill="#ffd23f"><ellipse cy="-12" rx="4" ry="7" transform="rotate(15)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(45)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(75)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(105)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(135)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(165)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(195)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(225)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(255)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(285)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(315)"/><ellipse cy="-12" rx="4" ry="7" transform="rotate(345)"/></g><circle r="8" fill="#5c3517"/><circle r="5" fill="#8a5a2b"/></symbol>
<symbol id="l" viewBox="-20 -20 40 40"><g fill="#fff" stroke="#f27fae" stroke-width="1"><path d="M0 0C-7-8-5-16 0-20 5-16 7-8 0 0z" transform="rotate(0)"/><path d="M0 0C-7-8-5-16 0-20 5-16 7-8 0 0z" transform="rotate(60)"/><path d="M0 0C-7-8-5-16 0-20 5-16 7-8 0 0z" transform="rotate(120)"/><path d="M0 0C-7-8-5-16 0-20 5-16 7-8 0 0z" transform="rotate(180)"/><path d="M0 0C-7-8-5-16 0-20 5-16 7-8 0 0z" transform="rotate(240)"/><path d="M0 0C-7-8-5-16 0-20 5-16 7-8 0 0z" transform="rotate(300)"/></g><path d="M0 0L-5 -9" stroke="#e8590c" stroke-width="1.5"/><circle cx="-5" cy="-9" r="2" fill="#ff9f1c"/><path d="M0 0L0 -11" stroke="#e8590c" stroke-width="1.5"/><circle cx="0" cy="-11" r="2" fill="#ff9f1c"/><path d="M0 0L5 -9" stroke="#e8590c" stroke-width="1.5"/><circle cx="5" cy="-9" r="2" fill="#ff9f1c"/></symbol></defs>
<g stroke="#5fb98a" stroke-width="5" stroke-linecap="round" fill="none"><path d="M100 250V150"/><path d="M100 250Q70 190 52 120"/><path d="M100 250Q130 190 150 115"/><path d="M100 250Q85 180 105 80"/></g>
<path d="M78 200q-30-10-28-34 24 4 28 34zM122 205q30-10 30-34-26 6-30 34z" fill="#6fcb9b" stroke="#3f9d6e" stroke-width="2"/>
<use href="#l" x="68" y="38" width="68" height="68"/>
<use href="#l" x="20" y="56" width="52" height="52"/>
<use href="#l" x="130" y="52" width="52" height="52"/>
<use href="#s" x="16" y="88" width="68" height="68"/>
<use href="#s" x="118" y="82" width="68" height="68"/>
<use href="#s" x="68" y="92" width="64" height="64"/>
<path d="M52 150L100 252 148 150Q100 130 52 150z" fill="#ffb8d4" stroke="#c2457f" stroke-width="3" stroke-linejoin="round"/>
<path d="M100 215l-26-14v26zM100 215l26-14v26z" fill="#f2679f" stroke="#c2457f" stroke-width="2"/><circle cx="100" cy="215" r="8" fill="#ffa6c9" stroke="#c2457f" stroke-width="2"/>
</svg>
</div>
<p id="hint">Tap the cake to blow out the candles 🕯️</p>
</main>
<div id="start"><div class="big">🎀</div><h2>Hi Klang Klang, open me!</h2><button id="go">Start the party 💖</button></div>
<audio id="song" src="music.mp3" loop preload="auto"></audio>
<script>
const $=s=>document.querySelector(s),song=$('#song'),cv=$('#fx'),cx=cv.getContext('2d');
const cols=['#f2679f','#ffc2da','#ffa6c9','#fff','#ffd6e6','#ff8fb8'];
[...'Happy Birthday!'].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c===' '?'\u00a0':c;s.style.setProperty('--i',i);$('#hb').appendChild(s)});
const em=['💖','🎀','🌸','💗','🦋','🍓'],fl=$('#float'),R=Math.random;
for(let i=0;i<16;i++){const h=document.createElement('div');h.className='h';h.textContent=em[i%6];h.style.cssText=`left:${i*6.4}%;--s:${22+R()*26}px;--d:${10+R()*9}s;--dl:${-R()*18}s`;fl.appendChild(h)}
for(let i=0;i<14;i++){const s=document.createElement('div');s.className='sp';s.textContent='✨';s.style.cssText=`left:${R()*96}%;top:${R()*92}%;--s:${14+R()*16}px;--dl:${-R()*2}s`;fl.appendChild(s)}
let W,H,P=[];const fit=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};fit();addEventListener('resize',fit);
function burst(x,y,n=90){for(let i=0;i<n;i++){const a=R()*6.28,v=4+R()*9;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,s:5+R()*7,r:R()*6,vr:(R()-.5)*.4,c:cols[i%6],l:140+R()*80,o:i%4==0})}}
function rain(){if(P.length<140)P.push({x:R()*W,y:-10,vx:R()*2-1,vy:2+R()*3,s:6+R()*6,r:0,vr:(R()-.5)*.3,c:cols[R()*6|0],l:400,o:R()<.2})}
(function loop(){cx.clearRect(0,0,W,H);rain();P=P.filter(p=>p.l-->0&&p.y<H+20);for(const p of P){p.vy+=.12;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;if(p.o){cx.beginPath();cx.arc(0,0,p.s/2,0,6.3);cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}requestAnimationFrame(loop)})();
let mut=false;
function playSong(){song.play().catch(()=>{})}
$('#go').onclick=()=>{$('#start').classList.add('hide');$('#mute').classList.remove('hide');playSong();burst(W/2,H/2,160);setTimeout(()=>burst(W*.25,H*.4),500);setTimeout(()=>burst(W*.75,H*.4),800)};
$('#mute').onclick=()=>{mut=!mut;song.muted=mut;$('#mute').textContent=mut?'🔇':'🔊'};
const cake=$('#cake');function blow(){const o=cake.classList.toggle('out');$('#hint').textContent=o?'Make a wish, Klang Klang! 💫 Tap to relight':'Tap the cake to blow out the candles 🕯️';const r=cake.getBoundingClientRect();if(o)burst(r.left+r.width/2,r.top+r.height*.3,120)}
cake.onclick=blow;cake.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();blow()}};
</script></body></html>
